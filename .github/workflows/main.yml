on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: |
          if ! git diff --exit-code; then
            echo '::error::Generated files are not up-to-date'
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/build.js
            dist/publish.js

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]  # Three latest major versions
    permissions:
      contents: read
    steps:
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap apparmor-profiles
          sudo ln -s /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/
          sudo systemctl reload apparmor
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@v9.0.0
        with:
          script: await require("./.github/scripts/release.cjs")({ github, context });
